<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生成今日数据 | 股票大作手 | Turnpo</title>
    <meta name="description" content="从全市场行情到鹰眼与 PDC 的可信数据生成流程。" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://www.turnpo.com/stock-pdc/decision/" />
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css?v=0.1.223" />
    <link rel="stylesheet" href="/stock-pdc/stock-pdc.css?v=20260809-md-copy" />
    <link rel="stylesheet" href="/stock-pdc/decision/decision.css" />
  </head>
  <body>
    <header class="topbar stock-decision-topbar">
      <a class="brand" href="/" aria-label="Turnpo home"><span class="brand-mark" aria-hidden="true"></span><span>Turnpo</span></a>
      <p>股票大作手 / 生成今日数据</p>
      <div class="top-actions"><a class="ghost-btn" href="/stock-pdc/">查看每日 Top 20</a></div>
    </header>

    <main class="stock-shell stock-decision-shell">
      <section class="decision-command" aria-labelledby="generationTitle">
        <div>
          <div class="decision-kicker"><span></span> 可信数据运行</div>
          <h1 id="generationTitle">生成今日 Stock PDC 数据</h1>
          <p>服务端将自行抓取全市场 A 股、应用固定鹰眼规则并评分全部通过者。浏览器不会提交或选择股票名单。</p>
        </div>
        <div class="decision-command-actions">
          <span class="decision-demo-badge" id="generationMode">等待计算服务</span>
          <button class="stock-primary-btn decision-generate-btn" id="startGeneration" type="button">开始生成</button>
        </div>
      </section>

      <section class="decision-run-strip" aria-label="生成运行状态">
        <article><span>运行编号</span><strong id="runId">等待创建</strong></article>
        <article><span>市场数据</span><strong id="marketCount">--</strong></article>
        <article><span>鹰眼通过</span><strong id="candidateCount">--</strong></article>
        <article><span>PDC 评分</span><strong id="pdcCount">--</strong></article>
      </section>

      <section class="decision-workspace" aria-labelledby="flowTitle">
        <div class="stock-section-head"><div><h2 id="flowTitle">运行流程</h2><p id="generationMessage" aria-live="polite">尚未创建运行。</p></div><span class="decision-progress-count" id="runStatus">IDLE</span></div>
        <ol class="decision-steps" id="generationSteps"></ol>
      </section>

      <section class="decision-result" id="generationResult" hidden aria-labelledby="resultTitle">
        <div class="stock-section-head"><div><h2 id="resultTitle">完整性校验</h2><p>只有校验通过的 Run 才能发布到每日 Top 20 页面。</p></div><button class="stock-primary-btn decision-publish-btn" id="publishGeneration" type="button" hidden>发布此 Run</button></div>
        <div class="decision-review-content" id="integrityResult"></div>
      </section>
      <nav class="stock-bottom-home" aria-label="Stock PDC generation navigation">
        <button class="stock-bottom-home-btn stock-markdown-copy-btn" id="copyGenerationMarkdown" type="button">生成并复制本次 Run MD</button>
        <a class="stock-bottom-home-btn" href="/stock-pdc/">查看每日 Top 20</a>
        <a class="stock-bottom-home-btn" href="/">回到主页</a>
      </nav>
      <p class="stock-markdown-copy-feedback" id="generationMarkdownFeedback" role="status" aria-live="polite"></p>
    </main>

    <script src="/stock-pdc/decision/decision.js?v=20260809-trusted-run-md-copy"></script>
  </body>
</html>
