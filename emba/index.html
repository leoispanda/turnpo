<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMBA 学习计划 | Turnpo</title>
    <meta name="description" content="按周一到周五安排预习与复习的 EMBA 学习计划。" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://www.turnpo.com/emba/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EMBA 学习计划 | Turnpo" />
    <meta property="og:description" content="A private EMBA learning timeline." />
    <meta property="og:url" content="https://www.turnpo.com/emba/" />
    <meta property="og:image" content="https://www.turnpo.com/assets/turnpo-og-image.png" />
    <meta name="theme-color" content="#f6f5f0" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/styles.css?v=0.1.431" />
    <link rel="stylesheet" href="/emba/emba.css?v=0.1.431&amp;layout=20260922-simple-plan" />
    <link rel="stylesheet" href="/emba/study-theme.css?v=20260922-refined" />
  </head>
  <body class="emba-learning-page">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Turnpo home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Turnpo</span>
      </a>
      <div></div>
      <div class="top-actions">
        <a class="ghost-btn emba-home-link" href="/">首页</a>
        <button class="ghost-btn emba-edit-toggle" id="embaEditToggle" type="button" aria-pressed="false" hidden>编辑</button>
        <button class="ghost-btn emba-lock-btn" id="embaLock" type="button" hidden>退出</button>
      </div>
    </header>

    <section class="emba-access-gate" id="embaAccessGate" aria-label="EMBA access">
      <form class="emba-access-card" id="embaAccessForm" method="post">
        <div>
          <span class="emba-access-eyebrow">PRIVATE LEARNING</span>
          <h1>进入学习空间</h1>
          <p>从一日的专注，开始更深入的思考。</p>
        </div>
        <label>
          <span>访问密码</span>
          <input id="embaPassword" name="accessCode" type="password" autocomplete="current-password" placeholder="请输入密码" required />
        </label>
        <button class="gold-btn" type="submit">进入学习计划 →</button>
        <p class="emba-access-note" id="embaAccessNote" aria-live="polite"></p>
      </form>
    </section>

    <main class="emba-shell" id="embaApp" hidden>
      <section class="emba-stage" aria-label="EMBA horizontal timeline">
        <div class="emba-heading">
          <h1>EMBA <span class="emba-heading-divider" aria-hidden="true">/</span> 学习空间</h1>
          <span aria-hidden="true"></span>
          <p class="emba-sync-status" id="embaSyncStatus" aria-live="polite"></p>
        </div>
        <div class="emba-dock" aria-label="Learning months">
          <div class="emba-track" aria-hidden="true"></div>
          <div class="emba-timeline" id="embaTimeline"></div>
        </div>
        <section class="emba-month-detail" id="embaMonthDetail" aria-live="polite"></section>
      </section>
      <section class="emba-knowledge" id="embaKnowledge" aria-label="EMBA knowledge base search">
        <div class="emba-knowledge-controls" aria-label="Knowledge base search">
          <label class="emba-knowledge-search">
            <span class="sr-only">Search EMBA knowledge base</span>
            <input id="embaKnowledgeSearch" type="search" autocomplete="off" placeholder="Search EMBA notes" />
          </label>
        </div>
        <div class="emba-knowledge-status" id="embaKnowledgeStatus" aria-live="polite" hidden></div>
        <div class="emba-knowledge-results" id="embaKnowledgeResults" aria-label="Knowledge base search results" hidden></div>
      </section>
      <section class="emba-private-tools" aria-label="Private EMBA tools">
        <a class="emba-classmate-tool-link" href="./linkedin-class-connect.html">同学通讯录</a>
      </section>
    </main>

    <div class="emba-lightbox" id="embaLightbox" role="dialog" aria-modal="true" aria-hidden="true" hidden>
      <button class="emba-lightbox-backdrop" type="button" data-lightbox-close aria-label="Close photo preview"></button>
      <figure class="emba-lightbox-frame">
        <button class="emba-lightbox-close" type="button" data-lightbox-close aria-label="Close photo preview">×</button>
        <img id="embaLightboxImage" alt="" />
      </figure>
    </div>

    <script src="/emba/september-post-study.js?v=20260925-canvas-pdfs"></script>
    <script src="/emba/emba.js?v=0.1.431&amp;layout=20260925-canvas-pdfs"></script>
  </body>
</html>
