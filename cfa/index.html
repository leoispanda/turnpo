<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>September 2026 CFA | Turnpo</title>
    <meta name="description" content="Corporate Finance & Accounting - September 2026" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="stylesheet" href="/emba/emba.css" />
    <link rel="stylesheet" href="/cfa/cfa.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Turnpo home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Turnpo</span>
      </a>
      <div class="top-actions">
        <a class="ghost-btn emba-home-link" href="/">Turnpo home</a>
        <a class="ghost-btn" href="/emba/">EMBA Archive</a>
      </div>
    </header>

    <section class="emba-access-gate" id="cfaAccessGate" aria-label="CFA access">
      <form class="emba-access-card" id="cfaAccessForm">
        <div>
          <h1>CFA Hub</h1>
          <p>Enter the Team 6 password to open the September 2026 CFA hub.</p>
        </div>
        <label>
          <span>Password</span>
          <input id="cfaPassword" type="password" autocomplete="current-password" placeholder="Enter password" required />
        </label>
        <button class="gold-btn" type="submit">Enter</button>
        <p class="emba-access-note" id="cfaAccessNote" aria-live="polite"></p>
      </form>
    </section>

    <main class="emba-shell" id="cfaApp" hidden>
      <section class="emba-stage" aria-label="September 2026 CFA">
        <section class="emba-month-detail" id="embaMonthDetail" aria-live="polite">
          <p class="emba-empty-copy" style="text-align: center; padding: 48px 0;">正在加载 2026 年 9 月课程内容…</p>
        </section>
      </section>
    </main>

    <script src="/cfa/cfa.js"></script>
  </body>
</html>
